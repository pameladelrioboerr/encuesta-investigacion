<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b5e3b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Encuesta LME">
  <title>Encuesta LME</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    html,body{margin:0;width:100%;height:100%;background:#eef2f7;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    #estado{position:fixed;z-index:10;right:10px;bottom:10px;background:#fff;border:1px solid #dfe6ef;border-radius:999px;padding:.45rem .75rem;font-size:.8rem;box-shadow:0 3px 12px rgba(0,0,0,.12)}
    iframe{display:block;width:100%;height:100%;border:0;background:#eef2f7}
  </style>
</head>
<body>
  <iframe src="./index.html" title="Encuesta sobre Lactancia Materna Exclusiva"></iframe>
  <div id="estado" aria-live="polite">Preparando modo offline…</div>
  <script>
    const estado = document.getElementById('estado');

    function actualizarEstado(){
      estado.textContent = navigator.onLine ? '🟢 Lista para usar' : '📴 Modo offline';
    }

    window.addEventListener('online', actualizarEstado);
    window.addEventListener('offline', actualizarEstado);
    actualizarEstado();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          await navigator.serviceWorker.register('./service-worker.js', { scope: './' });
          estado.textContent = navigator.onLine ? '🟢 Offline preparado' : '📴 Modo offline';
        } catch (error) {
          estado.textContent = '⚠️ No se pudo activar el modo offline';
          console.error(error);
        }
      });
    }
  </script>
</body>
</html>
